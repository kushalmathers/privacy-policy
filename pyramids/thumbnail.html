<!doctype html><html><head><meta charset="utf-8"/><style>
@font-face{font-family:Barlow;src:url("fonts/barlow-700.woff2") format("woff2");font-weight:700}@font-face{font-family:Barlow;src:url("fonts/barlow-600.woff2") format("woff2");font-weight:600}@font-face{font-family:Inter;src:url("fonts/inter-500.woff2") format("woff2");font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1280px;height:720px;overflow:hidden;background:#17110b}#frame{position:absolute;inset:0;background:url("pyramid-scene.png") center center/cover no-repeat;filter:saturate(1.25) contrast(1.14) brightness(.98)}#grade{position:absolute;inset:0;background:linear-gradient(98deg,rgba(15,10,5,.94) 0%,rgba(16,11,6,.83) 31%,rgba(18,12,7,.35) 48%,rgba(15,10,5,.02) 70%)}#glow{position:absolute;inset:0;background:radial-gradient(ellipse at 78% 30%,rgba(255,174,72,.27),transparent 48%);mix-blend-mode:screen}#vignette{position:absolute;inset:0;box-shadow:inset 0 0 160px 30px rgba(0,0,0,.5);background:linear-gradient(180deg,rgba(0,0,0,.22),transparent 20%,transparent 76%,rgba(0,0,0,.6))}
#date{position:absolute;left:60px;top:52px;font:500 23px Inter,sans-serif;letter-spacing:.28em;color:#f2d29d;text-shadow:0 2px 12px #000}#rule{position:absolute;left:60px;top:122px;width:72px;height:8px;background:#e4a448}#kicker{position:absolute;left:60px;top:158px;font:500 25px Inter,sans-serif;letter-spacing:.28em;color:#efd5ac;text-shadow:0 2px 12px #000}
#title{position:absolute;left:54px;top:212px;font-family:Barlow,sans-serif;font-weight:700;line-height:.88;text-transform:uppercase;letter-spacing:-.015em}#title .how{display:block;font-size:86px;color:#f4efe4;text-shadow:0 4px 24px #000}#title .built{display:block;font-size:137px;color:#efb457;text-shadow:0 5px 28px #000}#title .pyramid{display:block;font-size:111px;color:#fff;margin-top:12px;text-shadow:0 5px 28px #000}#tag{position:absolute;left:60px;bottom:80px;font:600 32px Barlow,sans-serif;letter-spacing:.11em;color:#f3eee4;text-shadow:0 3px 14px #000}#tag b{color:#efb457}#bottom{position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(90deg,#d79a42 0 54%,#483019 54% 100%)}
</style></head><body><div id="frame"></div><div id="grade"></div><div id="glow"></div><div id="vignette"></div><div id="date">GIZA · c. 2550 BCE</div><div id="rule"></div><div id="kicker">ANCIENT EGYPT'S GREATEST FEAT</div><div id="title"><span class="how">HOW THEY</span><span class="built">BUILT</span><span class="pyramid">THE PYRAMIDS</span></div><div id="tag">2 MILLION BLOCKS. <b>ONE ANCIENT WONDER.</b></div><div id="bottom"></div></body></html>
